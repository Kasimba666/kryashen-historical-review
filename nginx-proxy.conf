# Этот конфиг нужно добавить в секцию server {} nginx для домена tarihjournals.ru
# (или для поддомена kryashen.tarihjournals.ru, если у него отдельный server block)
#
# Путь к файлу обычно: /etc/nginx/sites-available/tarihjournals.ru
# После добавления: sudo nginx -t && sudo systemctl reload nginx

# Прокси для API-запросов SPA к OJS (без CORS, same-origin)
location /api/ {
    proxy_pass https://tarihjournals.ru/index.php/kryashen/api/;
    proxy_set_header Host tarihjournals.ru;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cookie_path /index.php/kryashen /;
    proxy_cookie_domain tarihjournals.ru $host;
}

# Прокси для $$$call$$$ (component-handler для выпусков)
location /$$$call$$$/ {
    proxy_pass https://tarihjournals.ru/index.php/kryashen/$$$call$$$/;
    proxy_set_header Host tarihjournals.ru;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cookie_path /index.php/kryashen /;
    proxy_cookie_domain tarihjournals.ru $host;
}

# Прокси для /ru (логин, дашборд)
location /ru/ {
    proxy_pass https://tarihjournals.ru/index.php/ru/;
    proxy_set_header Host tarihjournals.ru;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cookie_path /index.php/kryashen /;
    proxy_cookie_domain tarihjournals.ru $host;
}

# SPA fallback — все запросы к несуществующим файлам отдаём index.html
location / {
    try_files $uri $uri/ /kryashen/index.html;
}