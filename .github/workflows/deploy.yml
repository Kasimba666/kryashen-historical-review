name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Доступы для GitHub Pages (OIDC) и чтения кода
permissions:
  contents: read
  pages: write
  id-token: write

# Не прерывать текущий деплой, но не накладывать новый поверх идущего
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------
  # 1. Сборка production-билда
  # ---------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # vite build --mode production подхватывает .env.production
      # (VITE_OJS_BASE_URL + VITE_OJS_API_KEY + VITE_OJS_PROXY_URL)
      # и выставляет base = /kryashen-historical-review/
      - name: Build for production
        run: yarn build:prod

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # ---------------------------------------------------------------
  # 2. Деплой на GitHub Pages
  # ---------------------------------------------------------------
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ---------------------------------------------------------------
  # 3. (Опционально) Деплой Cloudflare Worker-прокси
  #    Запускается только если задан секрет CLOUDFLARE_API_TOKEN.
  #    Прокси нужен для операций с выпусками ($$$call$$$) на gh-pages,
  #    т.к. обходит SameSite-блокировку кросс-доменных cookie.
  #    Чтобы включить: добавьте в Secrets репозитория
  #    CLOUDFLARE_API_TOKEN (с правами Workers:Edit) и при необходимости
  #    CLOUDFLARE_ACCOUNT_ID.
  # ---------------------------------------------------------------
  deploy-proxy:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy Cloudflare Worker proxy
        run: wrangler deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}